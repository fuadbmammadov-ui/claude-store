# Host Nginx reverse-proxy konfiqurasiyası (Oracle Cloud VM üzərində).
# Quraşdırma: /etc/nginx/sites-available/magaza-pos.conf-a köçürüb
#   ln -s /etc/nginx/sites-available/magaza-pos.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# FAZA 1 (indiki vəziyyət): domen/Cloudflare hələ yoxdur — VM-in ictimai IP-si üzərindən
# sadə HTTP (port 80) ilə test edilir. HTTPS/Cloudflare Origin CA sertifikatı Faza 2-də
# (domen alındıqdan sonra) bu fayla əlavə olunacaq.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

